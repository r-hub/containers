services:

  debian-unstable-devel:
    command: ./build.sh
    environment:
      - R_VERSION=devel
      - LOCAL_STORE=/tmp/output
    build:
      context: .
      dockerfile: builder/Dockerfile.debian-unstable-devel
    image: rhub/debian-unstable-devel:latest
    volumes:
      - ./integration/tmp:/tmp/output

  ubuntu-2604:
    command: ./build.sh
    environment:
      - R_VERSION=devel
      - LOCAL_STORE=/tmp/output
    build:
      context: .
      dockerfile: builder/Dockerfile.ubuntu-2604
    image: rhub/ubuntu-2604:latest
    volumes:
      - ./integration/tmp:/tmp/output

  ubuntu-2604-clang:
    command: ./build.sh
    environment:
      - R_VERSION=devel
      - R_TYPE=-clang
      - LOCAL_STORE=/tmp/output
    build:
      context: .
      dockerfile: builder/Dockerfile.ubuntu-2604-clang
    image: rhub/ubuntu-2604-clang:latest
    volumes:
      - ./integration/tmp:/tmp/output

  ubuntu-2604-rchk:
    command: ./build.sh
    environment:
      - R_VERSION=devel
      - R_TYPE=-rchk
      - LOCAL_STORE=/tmp/output
    #      - R_TARBALL_URL=https://cran.microsoft.com/snapshot/2023-02-28/src/base-prerelease/R-devel_2023-02-27_r83911.tar.gz
    #      - R_TARBALL_URL=https://cran.microsoft.com/snapshot/2023-03-01/src/base-prerelease/R-devel_2023-02-28_r83917.tar.gz
    #      - R_TARBALL_URL=https://github.com/r-hub/containers/releases/download/latest/R-devel_2023-03-15_r83984-0.tar.gz
    build:
      context: .
      dockerfile: builder/Dockerfile.ubuntu-2604-rchk
    image: rhub/ubuntu-2604-rchk:latest
    volumes:
      - ./integration/tmp:/tmp/output

  ubuntu-2604-nold:
    command: ./build.sh
    environment:
      - R_VERSION=devel
      - R_TYPE=-nold
      - XCONFIGURE_OPTIONS=--disable-long-double
      - LOCAL_STORE=/tmp/output
    build:
      context: .
      dockerfile: builder/Dockerfile.ubuntu-2604-nold
    image: rhub/ubuntu-2604-nold:latest
    volumes:
      - ./integration/tmp:/tmp/output

  ubuntu-2604-asan:
    command: ./build.sh
    environment:
      - R_VERSION=devel
      - R_TYPE=-asan
      - LOCAL_STORE=/tmp/output
    build:
      context: .
      dockerfile: builder/Dockerfile.ubuntu-2604-asan
    image: rhub/ubuntu-2604-asan:latest
    volumes:
      - ./integration/tmp:/tmp/output

  fedora-gcc16:
    platform: linux/amd64
    command: ./build.sh
    environment:
      - R_VERSION=devel
      - R_TYPE=-gcc16
      - LOCAL_STORE=/tmp/output
    build:
      context: .
      dockerfile: builder/Dockerfile.fedora-gcc16
    image: rhub/fedora-gcc16:latest
    volumes:
      - ./integration/tmp:/tmp/output

  fedora-mkl:
    platform: linux/amd64
    command: ./build.sh
    environment:
      - R_VERSION=devel
      - R_TYPE=-mkl
      - LOCAL_STORE=/tmp/output
    build:
      context: .
      dockerfile: builder/Dockerfile.fedora-mkl
    image: rhub/fedora-mkl:latest
    volumes:
      - ./integration/tmp:/tmp/output

  valgrind:
    command: ./build.sh
    environment:
      - R_VERSION=devel
      - R_TYPE=-valgrind
      - LOCAL_STORE=/tmp/output
    build:
      context: .
      dockerfile: builder/Dockerfile.valgrind
    image: rhub/valgrind:latest
    volumes:
      - ./integration/tmp:/tmp/output
