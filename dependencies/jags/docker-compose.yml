services:

  jags-clang23:
    platform: linux/amd64
    command: /root/build.sh
    build:
      context: .
      dockerfile: Dockerfile-clang23
    volumes:
      - .:/output

  jags-clang23-arm64:
    platform: linux/arm64
    command: /root/build.sh
    build:
      context: .
      dockerfile: Dockerfile-clang23
    volumes:
      - .:/output

  jags-fedora-44:
    platform: linux/amd64
    command: /root/build.sh
    build:
      context: .
      dockerfile: Dockerfile-fedora44
    volumes:
      - .:/output

  jags-fedora-44-arm64:
    platform: linux/arm64
    command: /root/build.sh
    build:
      context: .
      dockerfile: Dockerfile-fedora44
    volumes:
      - .:/output
