services:

  poppler-clang23:
    platform: linux/amd64
    command: /root/build.sh
    build:
      context: .
      dockerfile: Dockerfile-clang23
    volumes:
      - .:/output

  poppler-clang23-arm64:
    platform: linux/arm64
    command: /root/build.sh
    build:
      context: .
      dockerfile: Dockerfile-clang23
    volumes:
      - .:/output
